[project]
name = "equitymind"
version = "0.2.0"
description = "EquityMind: AI financial analyst agent producing Buy/Sell/Hold stock scorecards (Google ADK + yfinance)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]>=2.0.0",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "yfinance>=0.2.50",
    "pandas>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
cloud = [
    "opentelemetry-exporter-gcp-trace>=1.6",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["equitymind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real Gemini API / market data (requires GOOGLE_API_KEY)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501"]

[tool.coverage.run]
source = ["equitymind"]
