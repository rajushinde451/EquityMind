name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests (offline) + coverage
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: equitymind:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name em -p 8080:8080 -e GOOGLE_API_KEY=dummy equitymind:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 1; done
          curl -fs localhost:8080/healthz
          docker logs em
          docker rm -f em

  agent-eval:
    # Live LLM evals: run on main / manual trigger when the API key secret exists.
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event_name != 'pull_request'
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Run agent evals
        if: env.GOOGLE_API_KEY != ''
        run: uv run python evals/run_eval.py --min-pass-rate 0.8
      - uses: actions/upload-artifact@v4
        if: always() && env.GOOGLE_API_KEY != ''
        with:
          name: eval-results
          path: evals/results/
